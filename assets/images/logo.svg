<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 6 94 106" role="img" aria-label="Quintasoft">
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f1ff"/>
      <stop offset="0.45" stop-color="#84c7f9"/>
      <stop offset="1" stop-color="#1e9bf0"/>
    </linearGradient>
    <mask id="qcut">
      <rect x="0" y="0" width="120" height="120" fill="#fff"/>
      <line x1="40" y1="46.5" x2="118" y2="124.5" stroke="#000" stroke-width="29"/>
    </mask>
  </defs>
  <!-- Ring, with a diagonal cut where the tail passes through -->
  <circle cx="55" cy="53" r="35" fill="none" stroke="url(#qg)" stroke-width="18.5" mask="url(#qcut)"/>
  <!-- Tail: italic slash parallelogram (vertical end cuts), corners rounded
       by the round-join stroke that matches the fill -->
  <path d="M 64.5 61.5 L 92.8 89.8 L 92.8 106.3 L 64.5 78 Z"
        fill="url(#qg)" stroke="url(#qg)" stroke-width="6" stroke-linejoin="round"/>
</svg>
